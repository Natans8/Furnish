[project]
name = "furnish"
version = "0.1.0"
description = "Doodad sets of World of Warcraft WMOs as a database, for spawning them on Epsilon."
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{ name = "Natan Shick" }]
requires-python = ">=3.14"
# A floor only where the code needs that version, its reason beside it. uv.lock pins what
# actually runs, and `uv sync --upgrade` moves every pin at once.
dependencies = [
    # The spawn order's walk: the nearest placement left, at every step of every
    # set, which is millions of distances on the largest WMOs.
    "numpy",
    # Progress for the steps that take minutes: a walk over sixteen thousand
    # roots, a download of the display table.
    "tqdm",
]

[project.scripts]
furnish = "furnish.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "lupa>=2.1",  # the bundled Lua 5.1 module the tests import, lupa.lua51
    "mypy",
    "pytest",
    "ruff",
    "types-tqdm",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--quiet --no-header"

[tool.mypy]
strict = true
warn_unreachable = true
python_version = "3.14"
files = ["src", "tests"]

# lupa ships no stubs; the Lua values it returns are typed at the test that reads them.
[[tool.mypy.overrides]]
module = ["lupa", "lupa.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "D", "N", "PL", "PERF", "FURB"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8
